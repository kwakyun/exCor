    - "data/rag/**"
    - "evals/rag/**"
    - "docs/reports/backend/**"
    - "docs/reports/rag/**"
    - "docs/reports/handoffs/agent_03/**"
  agent_04: 
    - "chain/**"
    - "src/server/application/stamps/**"
    - "src/server/controllers/stamps/**"
    - "src/server/providers/signing/**"
    - "src/server/providers/rpc/**"
    - "jobs/chain-indexer/**"
    - "docs/reports/onchain/**"
    - "docs/reports/handoffs/agent_04/**"
write_scope: 
  - "src/App.tsx"
  - "src/main.tsx"
  - "src/types/**"
  - "src/domain/**"
  - "src/data/**"
  - "src/workers/**"
  - "src/components/**"
  - "src/styles/**"
  - "src/services/**"
  - "benchmarks/**"
  - "package.json"
  - "package-lock.json"
  - "tsconfig*.json"
  - "vite.config.ts"
  - ".github/workflows/**"
  - ".gitignore"
  - ".env.example"
  - "scripts/**"
  - "README.md"
