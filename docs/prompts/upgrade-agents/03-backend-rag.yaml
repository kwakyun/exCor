    - "data/rag/**"
    - "evals/rag/**"
    - "docs/reports/backend/**"
    - "docs/reports/rag/**"
    - "docs/reports/handoffs/agent_03/**"
  agent_04: 
    - "chain/**"
    - "src/server/application/stamps/**"
    - "src/server/controllers/stamps/**"
    - "src/server/providers/signing/**"
    - "src/server/providers/rpc/**"
    - "jobs/chain-indexer/**"
    - "docs/reports/onchain/**"
    - "docs/reports/handoffs/agent_04/**"
write_scope: 
  - "src/shared/api/**"
  - "src/server/app.ts"
  - "src/server/server.ts"
  - "src/server/types.ts"
  - "src/server/controllers/planController.ts"
  - "src/server/controllers/rag/**"
  - "src/server/application/plans/**"
  - "src/server/application/rag/**"
  - "src/server/repositories/**"
  - "src/server/storage/**"
  - "src/server/providers/models/**"
  - "src/server/__tests__/**"
  - "db/migrations/**"
  - "jobs/ingest/**"
  - "data/rag/**"
  - "evals/rag/**"
  - "docs/reports/backend/**"
  - "docs/reports/rag/**"
  - "docs/reports/handoffs/agent_03/**"
priority_queue: 
  - "P1-05"
  - "P2-01"
  - "P1-06"
  - "P3-DB"
  - "P3-ROUTES"
  - "P2-02"
  - "P2-03"
  - "P2-04"
  - "P2-06-ENGINE"
fallback_work: 
  - "P1-02 대기 중에는 DTO/repository mock 및 관광 출처/평가 질문을 준비한다."
  - "04 계약 전에는 승인/event/projection 스키마 요구를 초안으로 만들고 구체 필드는 인계 후 확정한다."
  - "모델 접근 불가 시 고정 provider와 검색 fixture를 검증하며 실제 생성 평가만 차단 항목으로 남긴다."
work_items: 
  -
    owner: "agent_03"
    id: "P1-05"
    parent_tasks: 
      - "P1-05"
    depends_on: 
      - "C0"
    title: "API 및 repository 인터페이스"
    steps: 
      - "src/shared/api에 브라우저 안전 DTO와 오류 계약을 정의한다."
      - "/api/v1 및 기존 API 호환 어댑터, PlanRepository 인터페이스를 구현한다."
      - "P1-02가 오기 전에는 mock 엔진으로 transport 테스트하고 실제 저장 통과로 보고하지 않는다."
    deliverables: 
      - "src/shared/api/"
      - "src/server/application/plans/"
      - "src/server/repositories/"
      - "docs/reports/backend/api-contract.md"
    acceptance: 
      - "잘못된 입력·오류 envelope·구 API 계약 테스트"
      - "src/server 구현을 브라우저에서 import하지 않음"
    reviewer: "agent_01"
  -
    owner: "agent_03"
    id: "P1-06"
    parent_tasks: 
      - "P1-06"
    depends_on: 
      - "P1-05"
      - "P1-02"
      - "ENV-01"
    title: "DB와 실제 엔진 연결"
    steps: 
      - "PostgreSQL migration과 repository를 구현한다."
      - "브라우저 합계를 신뢰하지 않고 서버에서 엔진으로 재계산한다."
      - "멱등 키/동시 요청/과거 버전/서버 재시작을 검증하고 프론트엔드에 실제 endpoint를 인계한다."
    deliverables: 
      - "db/migrations/"
      - "src/server/repositories/"
      - "docs/reports/backend/persistence.md"
    acceptance: 
      - "재시작 후 공유 복원"
      - "같은 키 재시도는 같은 결과"
      - "다른 본문 재사용 409"
    reviewer: "agent_01"
  -
    owner: "agent_03"
    id: "P2-01"
    parent_tasks: 
      - "P2-01"
    depends_on: 
      - "C0"
    title: "RAG 자료와 평가셋 준비"
    steps: 
      - "전포의 허용 출처·이용 조건·장소 ID 매핑을 만든다."
      - "published/fetched/verified 시각을 구분한 문서·corpus 스키마를 설계한다."
      - "100개 질문을 개발60/held-out40으로 분리하고 01에 정답 검수 요청을 보낸다."
    deliverables: 
      - "data/rag/sources/"
      - "evals/rag/datasets/"
      - "docs/reports/rag/corpus-plan.md"
    acceptance: 
      - "출처별 허용 범위 기록"
      - "검수되지 않은 자료를 사실로 확정하지 않음"
      - "평가셋 버전과 split 고정"
    reviewer: "agent_01"
  -
    owner: "agent_03"
    id: "P2-02"
    parent_tasks: 
      - "P2-02"
    depends_on: 
      - "P2-01"
      - "P1-06"
    title: "수집과 모델 어댑터"
    steps: 
      - "섹션별 청킹·content hash·재실행·부분 실패 재개를 구현한다."
      - "embedding/generation 어댑터를 분리하고 모델·차원별 corpus를 관리한다."
      - "실모델 접근이 없으면 deterministic mock 경로와 한계를 제출하고 제공업체 준비만 blocked로 표시한다."
    deliverables: 
      - "jobs/ingest/"
      - "src/server/providers/models/"
      - "db/migrations/"
      - "docs/reports/rag/provider-comparison.md"
    acceptance: 
      - "중복 임베딩 방지"
      - "가격은 검수 후보로만 저장"
      - "mock과 실모델 평가 구분"
    reviewer: "agent_01"
  -
    owner: "agent_03"
    id: "P2-03"
    parent_tasks: 
      - "P2-03"
    depends_on: 
      - "P2-02"
    title: "한국어 하이브리드 검색"
    steps: 
      - "별칭·정규화·키워드와 벡터 검색을 비교한다."
      - "권역/활성/비용 필터와 순위 결합·장소 중복 제거를 구현한다."
      - "개발셋에서 top-k/청킹/RRF를 튜닝하고 최종 평가 설정을 고정한다."
    deliverables: 
      - "src/server/application/rag/"
      - "evals/rag/config/"
      - "docs/reports/rag/retrieval.md"
    acceptance: 
      - "키워드/벡터/하이브리드 비교"
      - "held-out 정답으로 튜닝하지 않음"
    reviewer: "agent_01"
  -
    owner: "agent_03"
    id: "P2-04"
    parent_tasks: 
      - "P2-04"
    depends_on: 
      - "P2-03"
      - "P1-02"
    title: "RAG 응답과 엔진 연결"
    steps: 
      - "조건 추출→검색 후보→예산 엔진→설명→인용/스키마 검증을 연결한다."
      - "clarify/insufficient_evidence/infeasible/서비스 오류를 구분한다."
      - "새 controller와 route를 실제 API에 연결하고 02에 샘플 응답·endpoint·버전을 넘긴다."
    deliverables: 
      - "src/server/application/rag/"
      - "src/server/controllers/rag/"
      - "src/server/app.ts"
      - "docs/reports/rag/api.md"
    acceptance: 
      - "없는 장소·조작 가격·허구 인용 차단"
      - "후보 확대 후 기본 플래너 fallback 명시"
    reviewer: "agent_01"
  -
    owner: "agent_03"
    id: "P2-06-ENGINE"
    parent_tasks: 
      - "P2-06"
    depends_on: 
      - "P2-04"
    title: "평가 실행기와 RAG 제한"
    steps: 
      - "timeout/토큰·요청 비용 상한/캐시 버전/재시도 제한을 적용한다."
      - "Recall@5·Hit@5·근거 지지·유보·금액 무결성·p95·비용을 분리해 보고하는 실행기를 만든다."
      - "QA용 고정 corpus/모델/프롬프트/설정을 인계한다."
    deliverables: 
      - "evals/rag/runner/"
      - "evals/rag/config/"
      - "docs/reports/rag/limits.md"
