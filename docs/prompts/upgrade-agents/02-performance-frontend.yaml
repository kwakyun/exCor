priority_queue: 
  - "P1-01"
  - "ENV-01"
  - "P1-02"
  - "P1-03"
  - "P1-04"
  - "UI-CONTRACTS"
  - "P2-05"
  - "P3-05"
fallback_work: 
  - "03/04의 package 요청을 처리하고 실행 명령을 검증한다."
  - "C0 문서를 교차 검토해 01의 자기 승인 방지를 돕는다."
  - "RAG/지갑 mock fixture의 실패 상태 및 접근성·모바일 화면을 검증한다."
work_items: 
  -
    owner: "agent_02"
    id: "P1-01"
    parent_tasks: 
      - "P1-01"
    depends_on: []
    title: "현황과 baseline"
    steps: 
      - "현재 scripts와 의존성을 확인한 후 기존 테스트·빌드를 재현한다."
      - "원본 및 seed 고정 확대 데이터의 실행 시간·번들·렌더링 기준을 기록한다."
      - "실행 환경·commit·warm-up·반복·timeout과 원래 존재한 실패를 분리한다."
    deliverables: 
      - "benchmarks/baseline/"
      - "docs/reports/performance/baseline.md"
    acceptance: 
      - "미실행/timeout은 그대로 기록"
      - "인원 계산·공유 실패 등 현재 결함을 식별"
    reviewer: "agent_01"
  -
    owner: "agent_02"
    id: "ENV-01"
    parent_tasks: []
    depends_on: 
      - "P1-01"
    title: "공유 실행 환경과 의존성 창구"
    steps: 
      - "루트 package/lockfile/CI의 단일 작성자로 Node 호환성과 독립 API·작업 실행 명령을 관리한다."
      - "03/04가 보낸 패키지 요청을 API 계약이 정해진 순서로 묶어서 반영한다."
      - "아직 존재하지 않는 entrypoint의 script는 완료된 것처럼 문서화하지 않는다. 추가 시 실제 실행을 확인한다."
      - "이 작업의 초깃값 인계 이후에도 새 요청을 같은 소유권으로 처리하고 버전 인계를 발행한다."
    deliverables: 
      - "docs/runbooks/development.md"
      - "루트 package 및 lockfile의 필요한 변경"
    acceptance: 
      - "루트/chain 실행 경계 기록"
      - "명령 실행 증거"
      - "실제 secret 없이 placeholder 설정"
    reviewer: "agent_01"
  -
    owner: "agent_02"
    id: "P1-02"
    parent_tasks: 
      - "P1-02"
    depends_on: 
      - "C0"
      - "P1-01"
    title: "정확한 예산 도메인"
    steps: 
      - "PlannerInput/PlanningResult/CatalogSnapshot을 순수 TypeScript로 구현한다."
      - "전체 여행자 예산, 인당/차량 비용, 빈 필수 카테고리, 불가능 결과와 교체 제약을 구현한다."
      - "ID/시각/저장을 엔진 밖으로 분리하고 서버/RAG가 사용할 참조 fixture와 facade를 인계한다."
    deliverables: 
      - "src/domain/"
      - "src/types/"
      - "src/services/budgetCalculator.ts"
      - "docs/reports/performance/engine-contract.md"
    acceptance: 
      - "총액/잔액·정수·인원 경계·입력 불변성 테스트"
      - "동일 입력과 버전은 동일 장소·금액"
    reviewer: "agent_01"
  -
    owner: "agent_02"
    id: "P1-03"
    parent_tasks: 
      - "P1-03"
    depends_on: 
      - "P1-02"
    title: "탐색 최적화"
    steps: 
      - "권역/카테고리 인덱스·가격 하한 가지치기·제한 LRU를 적용한다."
      - "참조 해와 전수 비교 가능한 소규모 fixture에서 정확성을 보존한다."
      - "1천/1만 장소 측정 후에만 Worker 또는 후보 축소를 선택한다."
    deliverables: 
      - "src/domain/"
      - "benchmarks/after/"
      - "docs/reports/performance/comparison.md"
    acceptance: 
      - "동일 조건 전후 측정"
      - "근사 탐색은 점수 손실 별도 표기"
      - "timeout 제외로 p95를 왜곡하지 않음"
    reviewer: "agent_01"
  -
    owner: "agent_02"
    id: "P1-04"
    parent_tasks: 
      - "P1-04"
    depends_on: 
      - "P1-02"
    title: "프론트엔드 상태와 로딩"
    steps: 
      - "draft/applied를 분리하고 저장·confetti는 확정 동작에 묶는다."
      - "탭/모달을 지연 로드하고 빠른 입력에서 오래된 결과를 무시한다."
      - "서버 저장 실패의 가짜 성공 링크를 제거하고 localStorage v2 읽기 검증을 구현한다."
    deliverables: 
      - "src/App.tsx"
      - "src/components/"
      - "src/services/planApi.ts"
      - "tests/ui/"
    acceptance: 
      - "입력 20회 변경 후 최신 결과"
      - "실패/손상 저장/탭 왕복 확인"
      - "UI mock 검증과 실제 API 검증을 구분"
    reviewer: "agent_01"
  -
    owner: "agent_02"
    id: "UI-CONTRACTS"
    parent_tasks: []
    depends_on: 
      - "C0"
      - "P1-04"
    title: "RAG 및 지갑 화면 선행 준비"
    steps: 
      - "C0의 응답 예시로 추천/지갑 mock adapter를 만들고 지연·오류·빈 상태를 구현한다."
      - "ABI/서버 완료 전 컴포넌트와 상태 전이 테스트를 끝낸다."
      - "mock은 별도 테스트 경로에 두고 실제 발급/추천 완료로 표시하지 않는다."
    deliverables: 
      - "tests/ui/"
      - "src/components/"
      - "docs/reports/frontend/mock-flows.md"
    acceptance: 
      - "mock/real 어댑터 교체 경계"
      - "지갑 미연결 기본 기능 유지"
    reviewer: "agent_01"
  -
    owner: "agent_02"
    id: "P2-05"
    parent_tasks: 
      - "P2-05"
    depends_on: 
      - "UI-CONTRACTS"
      - "P2-04"
    title: "추천 UI 실제 연결"
    steps: 
      - "추천 입력·출처 카드·현재 코스 비교·적용 동작을 연결한다."
      - "낡은 응답 무시와 모델 장애 fallback을 구현한다."
      - "실제 API와 확인한 상태별 화면 증거를 QA에 넘긴다."
    deliverables: 
      - "src/components/"
      - "src/services/ragApi.ts"
