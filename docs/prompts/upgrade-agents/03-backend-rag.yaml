schema_version: 2
kind: "self_contained_agent_prompt"
sequence: 3
agent_id: "agent_03"
role_name: "백엔드·DB·RAG 수집/검색/생성"
objective: "영속 저장과 RAG 전 과정을 소유한다. 온체인용 DB와 route만 짧은 우선 작업으로 제공해 04의 대기를 줄인다."
agent_registry: 
  -
    id: "agent_01"
    file: "01-coordinator-qa.yaml"
    slot: 1
  -
    id: "agent_02"
    file: "02-performance-frontend.yaml"
    slot: 2
  -
    id: "agent_03"
    file: "03-backend-rag.yaml"
    slot: 3
  -
    id: "agent_04"
    file: "04-onchain.yaml"
    slot: 4
context_files: 
  - "AGENTS.md"
  - "docs/architecture/implementation/README.md"
  - "docs/architecture/implementation/01-system-performance.md"
  - "docs/architecture/implementation/02-rag-system.md"
  - "docs/architecture/implementation/03-onchain-system.md"
common_protocol: 
  max_agents: 4
  coordinator_counts_toward_limit: true
  spawn_additional_agents: false
  execution: "manual_dispatch"
  default_mode: "plan"
  path_base: "repository_root"
  policy_version: "four-agent-v1"
  operating_rules: 
    - "이 파일은 프롬프트다. 읽었다는 이유로 다른 에이전트 실행·외부 게시·배포 권한이 생기지 않는다."
    - "AGENTS.md와 현재 사용자 지시를 우선한다. 기존 승인 범위를 재사용하고 미결정 정책만 분리한다."
    - "4개 슬롯에는 총괄 01도 포함한다. 추가 하위 에이전트·별도 리뷰어를 만들지 않는다. 역할은 지정한 네 인스턴스가 수행한다."
    - "번호는 초기 배정 순서다. 01 완료 후 02, 02 완료 후 03처럼 전체를 직렬 실행하지 않는다."
    - "현재 계획 문서의 타입/API/폴더는 목표 구조다. 실제 파일과 package scripts를 확인하고 구현 상태를 추정하지 않는다."
    - "구현은 실행 할당의 write_scope와 assigned_paths 교집합에서만 한다. 명시적인 실행 요청이 없거나 할당이 불완전하면 plan/읽기 전용 준비만 한다."
    - "동일 파일은 한 담당자만 수정한다. 다른 담당 파일 수정은 dependency_request로 인계하며 담당 범위 밖 수정을 임의로 확대하지 않는다."
    - "가능하면 동일 base commit에서 02/03/04 별도 worktree를 사용한다. shared checkout이면 파일 소유권을 지키고 브랜치 전환·merge·cherry-pick을 동시에 실행하지 않는다."
    - "제품 작업 브랜치 간 통합은 01이 순서를 조정하고 해당 변경 소유자가 수행한다. main merge·PR 자체 승인·production 배포는 하지 않는다."
    - "공통 계약은 01이 문서로 확정하고 코드 소유자가 구현한다. breaking change는 소비자 영향과 새 fixture를 전달한 후 버전 올림을 조정한다."
    - "증거가 없는 미실행을 PASS로 쓰지 않는다. 목표/측정값, mock/real 모델, 로컬 체인/공개 테스트넷을 분리한다."
    - "secret·개인키·실제 개인정보를 직접 조회/출력/커밋하지 않는다. 인증·DB·외부 서비스 정책은 적용되는 승인 규칙과 기존 승인 근거를 따른다."
    - "CI 권한 확대·branch protection 약화·파괴적 DB 변경을 하지 않는다. 격리된 테스트 DB에서만 재구축 시나리오를 실행한다."
  readiness: 
    hard_dependency: "depends_on 항목의 산출물·버전·base commit·필수 검증을 01이 확인하여 accepted_handoffs에 기록하면 실제 연결 작업을 시작한다."
    provisional_work: "선행 구현이 없더라도 승인된 계약 fixture로 mock/UI/단위 테스트/자료 준비는 가능하다. 해당 작업 완료나 실제 연동 성공으로 표시하지 않는다."
    dispatch: "ready 항목 중 아래 priority_queue 순서로 선택한다. 다른 에이전트 두 명 이상을 막는 짧은 인계 요청과 보안/정확성 수정은 다음 안전한 작업 경계에서 우선한다."
    blocked: "실패 원인과 필요한 담당 산출물을 1회 요청하고 fallback_work에서 독립 작업을 선택한다. 환경 실패는 즉시 알리고 동일 실패를 반복 실행하지 않는다."
    quality: "개발 handoff→01 독립 diff 검토→개별 AC 통과를 구분한다. P1/P2/P3 전체 PASS는 독립 통합 QA 뒤에만 가능하다."
    review: "01은 제품 구현의 독립 reviewer/QA다. 01이 작성한 계약·테스트·문서는 02가 교차 검토하며 자기 결과를 독립 검증으로 인정하지 않는다."
  handoff: 
    location: "docs/reports/handoffs/{agent_id}/{work_item_id}-{run_id}.md"
    required: 
      - "agent_id"
      - "work_item_id"
      - "parent_tasks"
      - "run_id"
      - "status"
      - "base_commit"
      - "result_commit_or_patch"
      - "changed_files"
      - "contract_versions"
      - "acceptance_results"
      - "verification_commands_and_results"
      - "artifacts"
      - "dependency_requests"
      - "remaining_risks"
      - "next_actions"
    statuses: 
      - "planned"
      - "in_progress"
      - "ready_for_review"
      - "accepted"
      - "changes_requested"
      - "blocked"
    dependency_request_fields: 
      - "request_id"
      - "from_agent"
      - "to_agent"
      - "consumer_work_item"
      - "requested_paths_or_interface"
      - "request_schema"
      - "response_fixture"
      - "blocking_scope"
      - "needed_before"
      - "verification_expectation"
    event_updates: 
      - "작업 시작"
      - "공통 계약 변경"
      - "선행 산출물 인계"
      - "실패/차단 발견"
      - "리뷰 요청"
      - "검증 완료"
    frequency: "상태 변화 시 전달하고 진행 중에는 의미 있는 진행 보고를 유지한다. 변화 없는 잦은 polling과 긴 메시지 재전송을 피한다."
    accepted_by: "제품 변경은 01. 01 소유 산출물은 02 교차 검토 후 01이 조정 기록. accepted는 사람 승인·merge·배포 권한을 의미하지 않는다."
  shared_resource_locks: 
    package_lock: "루트 package/lockfile/CI는 02, chain/package/lockfile은 04. 다른 에이전트가 해당 루트에서 의존성 추가/lock 갱신하지 않는다."
    migrations: "migration 번호·테이블·repository는 03 단독 작성. 04는 스키마 요구 및 fixture로 요청한다."
    route_registration: "src/server/app.ts·src/shared/api는 03 소유. 04는 controllers/stamps factory를 내보내고 03이 route 등록."
    frontend_types: "src/types 및 domain은 02. 서버 DTO는 src/shared/api에서 03. 중복 금액 타입을 조용히 새로 만들지 않는다."
    cpu_measurement: "02의 정식 성능 측정 구간에는 모델 평가·Hardhat 대량 테스트 등 같은 머신의 고부하 작업을 겹치지 않는다. 01이 짧은 측정 창을 배정한다."
    database: "에이전트/테스트별 DB 또는 schema namespace. 03이 이름과 migration 버전을 발급한다. 다른 작업의 데이터를 clear/reset하지 않는다."
    chain: "04가 로컬 노드/배포 metadata를 소유한다. 02/03은 읽기·사용자 tx만, reset/revert 테스트는 01/04가 시간을 예약한다."
    ports: "기존 프로세스 점유를 확인한 뒤 API·Vite·체인 포트를 할당한다. 충돌 시 다른 포트를 쓰고 타 작업 프로세스를 종료하지 않는다."
  assignment_example: 
    mode: "plan"
    work_item_id: "replace-with-owned-work-item"
    run_id: "replace-with-unique-id"
    base_commit: "replace-with-verified-sha"
    checkout_path: "replace-with-assigned-path"
    assigned_paths: []
    accepted_handoffs: []
    authorization_evidence: []
    acceptance_criteria: []
ownership_registry: 
  agent_01: 
    - "docs/architecture/implementation/**"
    - "docs/architecture/adr/**"
    - "docs/contracts/**"
    - "docs/reports/coordination/**"
    - "docs/reports/qa/**"
    - "docs/reports/review/**"
    - "tests/e2e/**"
    - "docs/reports/handoffs/agent_01/**"
  agent_02: 
    - "src/App.tsx"
    - "src/main.tsx"
    - "src/types/**"
    - "src/domain/**"
    - "src/data/**"
    - "src/workers/**"
    - "src/components/**"
    - "src/styles/**"
    - "src/services/**"
    - "benchmarks/**"
    - "package.json"
    - "package-lock.json"
    - "tsconfig*.json"
    - "vite.config.ts"
    - ".github/workflows/**"
    - ".gitignore"
    - ".env.example"
    - "scripts/**"
    - "README.md"
    - "docs/runbooks/**"
    - "tests/ui/**"
    - "docs/reports/performance/**"
    - "docs/reports/frontend/**"
    - "docs/reports/environment/**"
    - "docs/reports/handoffs/agent_02/**"
  agent_03: 
    - "src/shared/api/**"
    - "src/server/app.ts"
    - "src/server/server.ts"
    - "src/server/types.ts"
    - "src/server/controllers/planController.ts"
    - "src/server/controllers/rag/**"
    - "src/server/application/plans/**"
    - "src/server/application/rag/**"
